# api-convention.conf - per-library configuration for check-api-convention.sh
#
# Columns (whitespace separated):
#   dir      library directory, relative to the repository root
#   prefix   required symbol/header prefix (foo89)
#   ext      yes when an extension header (flat or hierarchical) is expected
#   priv     yes when src/<prefix>_priv.h is expected
#   legacy   grep -E alternation of forbidden legacy private dialects, or -
#   bundled  comma-free list of sibling prefixes allowed in the archive, or -
#   extra    comma-separated extra public headers (bridges), or -
#   layout   flat | hier | any (default any) expected extension-header layout
#   family   comma-separated allowed extension-family dependencies
. ledger89 yes yes - - - hier
